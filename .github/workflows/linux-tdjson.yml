name: Build TDLib tdjson for Linux x86_64

# Measurement tooling only (not shipped in the app). Builds the same TDLib commit as tdlib.env,
# unmodified, as libtdjson.so inside a Debian 12 container. Standard free runner, public repo.
on:
  push:
    branches: [linux-tdjson]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-tdjson:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build libtdjson.so in Debian 12
        run: |
          source tdlib.env
          docker build -f linux/Dockerfile.build --build-arg TDLIB_COMMIT="$TDLIB_COMMIT" -t tdjson-build .
          mkdir -p out
          cid=$(docker create tdjson-build)
          docker cp "$cid":/out/. out/
          docker rm "$cid"
          (cd out && sha256sum libtdjson.so > SHA256SUMS.txt && cat SHA256SUMS.txt version.txt ldd.txt)
          { echo '```'; cat out/SHA256SUMS.txt out/version.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          grep -q "commit_hash.*$TDLIB_COMMIT" out/version.txt
          grep -q "version.*$TDLIB_VERSION" out/version.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-tdjson
          path: out/
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
